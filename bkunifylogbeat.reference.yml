##################### bkunifylogbeat Configuration #############################

#==================== Main ================================================
max_procs: 1
logging.level: error
path.logs: /var/log/gse
path.data: /var/lib/gse
path.pid: /var/run/gse

#==================== Registry ================================================
registry.flush: "1s"

#==================== Output ================================================
output.bkpipe:
  endpoint: /var/run/ipc.state.report

#==================== bkunifylogbeat ================================================
bkunifylogbeat.maxbytes: 1024
bkunifylogbeat.maxline: 12
bkunifylogbeat.buffertimeout: 2
bkunifylogbeat.eventdataid: -1
bkunifylogbeat.max_cpu_limit: -1
bkunifylogbeat.cpu_check_times: 10
# 根据实际扫描耗时动态缩短各文件 input 的扫描周期，并将聚合扫描墙钟耗时
# 控制在配置的单核预算内；容器 CPU quota 小于 1 核时预算会等比例缩小。默认关闭。
#bkunifylogbeat.adaptive_scan:
#  enabled: false
#  min_scan_frequency: "1s"
#  scan_cpu_percent: 5
#  control_interval: "3s"
bkunifylogbeat.multi_config:
  - path: "/usr/local/gse/plugins/etc/bkunifylogbeat"
    file_pattern: "*.conf"


bkunifylogbeat.local:
  - dataid: 123
    input: tail
    path:
      - "/var/log/*.log"
      - "/data/bkee/logs/*.log"
    # 移除路径前缀
    remove_path_prefix: '/data/bkee'
    is_container_std: false
    exclude_files: [".gz$", ".tar$"]
    encoding: "utf-8"
    package: true
    package_count: 10
    # How often the input checks for new files in the paths that are specified
    scan_frequency: "1m"
    # Close inactive closes the file handler after the predefined period.
    close_inactive: "5m"
    # TODO: Ignore files which were modified more then the defined timespan in the past.
    ignore_older: "1d"
    # TODO: Files for the modification data is older then clean_inactive the state from the registry is removed
    clean_inactive: "1m"

    ### Multiline options
    # The regexp Pattern that has to be matched. The example pattern matches all lines starting with [
    multiline.pattern: "^\\["
    multiline.max_lines: 500
    multiline.timeout: "5s"

    # 自定义字段：兼容旧配置，数据在发送前附加额外字段
    ext_meta: xxx

    # process the data before delivering
    processors:
      # 数据过滤：兼容旧配置
      - filter:
          delimiter: "|"
          filters:
          - conditions:
              - index: -1
                key: "val1"
                op: "="

      # 数据过滤：通过正则匹配或过滤数据
      - grep:
          key_name: "key"
          regex: "Keep records by regex"
          exclude: "Exclude records by regex"

      # 数据解析：从path等提取数据
      - parser:
          key_name: "path"
          format: "regex"
          regex: "/var/log/containers/(?P<container_id>[^.]+).log"

  - dataid: 123
    input: winlog
    event_logs:
      - name: Application
        ignore_older: 72h
      - name: System
      - name: Security
      - name: ForwardedEvents
        tags: [forwarded]
      - name: Windows PowerShell
        event_id: 400, 403, 600, 800
      - name: Microsoft-Windows-PowerShell/Operational
        event_id: 4103, 4104, 4105, 4106
    processors:
      - grep:
          key_name: "event_id"
          regex: "keep records by regex"

  - dataid: 123
    type: kafka
    # kafka broker 地址列表
    hosts: ["kafka-1:9093", "kafka-2:9093"]
    # 消费的 topic 列表
    topics: ["logs"]
    # 消费组，同一 group_id 的多个采集器实例共同分摊 partition
    group_id: "bkunifylogbeat_123"
    # 消费组无已提交位点时的起始位置，可选 oldest/newest，默认 newest
    initial_offset: "newest"

    # SASL 认证：配置 username 后启用，密码必填
    username: "collector"
    password: "xxxx"
    # SASL 机制，可选 PLAIN / SCRAM-SHA-256 / SCRAM-SHA-512（大小写不敏感），
    # 不配置默认为 PLAIN
    sasl_mechanism: "SCRAM-SHA-512"

    # TLS 配置：与 SASL 组合即为 SASL_SSL
    ssl:
      enabled: true
      certificate_authorities: ["/etc/bkunifylogbeat/certs/ca.crt"]

    # 消息正文分列分隔符与过滤规则，与文件采集一致
    delimiter: "|"
    filters:
      - conditions:
          - index: 2
            key: "ERROR"
            op: "eq"

    ext_meta:
      bk_biz_id: "2"

